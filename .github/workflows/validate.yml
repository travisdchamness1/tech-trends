name: Validate technology-trends ledger

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate immutable ledger
        run: python scripts/validate_repository.py .
      - name: Verify run discovery
        run: python scripts/discover_runs.py . --latest
